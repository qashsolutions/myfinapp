[project]
name = "stackd-api"
version = "0.1.0"
description = "Stackd API: thin server for accounts, plans, groups, the alert schedule and ciphertext backups."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx2[http2]>=2.13",
    "webauthn>=3.0.1",
    "email-validator>=2.3.0",
    "pywebpush>=2.5.0",
    "stackd-rules",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
stackd-api = "app.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
stackd-rules = { path = "../rules" }
