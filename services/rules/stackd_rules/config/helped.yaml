# "What helped" in challenges (October 28, 2026; the list, the totals from 2 other members and
# opening at the target or the challenge's end signed off by the owner, October 29, 2026, with up
# to 5 choices (was 3); owner decision the same day: What helped is the only community feature at
# launch, no open forum, no tips, no polls): one fixed
# list of choices a member can pick (up to `max_choices`) once they reached their target or the
# challenge ended. No free text, by design: instead of a forum. The group sees only totals, and
# a member sees them only once `min_answers` members OTHER than themselves answered (so no
# one can take their own answer away and read another's). Shared by the API (validation) and
# the app (labels).
# Edit, then: uv run python scripts/build_helped.py
version: 1
max_choices: 5
min_answers: 2
choices:
  - id: packed_lunch
    label: "Packed lunch"
  - id: cooked_home
    label: "Cooked at home"
  - id: no_spend_days
    label: "No-spend days"
  - id: cut_subscription
    label: "Paused or cancelled a subscription"
  - id: payday_set_aside
    label: "Set money aside on payday"
  - id: waited_a_day
    label: "Waited a day before buying"
  - id: cash_for_treats
    label: "Used cash for treats"
  - id: shopping_list
    label: "Shopped with a list"
