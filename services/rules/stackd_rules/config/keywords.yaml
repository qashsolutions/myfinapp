# Default merchant keyword -> category table (docs/spec.md "Statement import": categories come
# from a keyword table; no machine learning). Matched case-insensitively as a substring of the
# cleaned description, top to bottom, first match wins. `direction` limits a keyword to money
# in or out. `transfer` words flag a likely transfer between the user's own accounts, which the
# import review asks about. Category ids are the defaults in apps/web/src/data/defaults.ts.
#
# Edit this file, then `uv run python scripts/build_keywords.py` to refresh both keywords.json
# copies (tests/test_keywords.py fails if they are stale). Proposed; tune from real statements.

transfer:
  - PAYMENT TO CARD
  - CARD PAYMENT
  - AUTOPAY PAYMENT
  - PAYMENT - THANK YOU
  - ONLINE TRANSFER
  - TRANSFER TO
  - TRANSFER FROM
  - XFER
  - ZELLE
  - VENMO CASHOUT

keywords:
  # money in
  - { match: PAYROLL, category_id: cat-paycheck, direction: in }
  - { match: DIRECT DEP, category_id: cat-paycheck, direction: in }
  - { match: SALARY, category_id: cat-paycheck, direction: in }
  - { match: REFUND, category_id: cat-refund, direction: in }
  - { match: REVERSAL, category_id: cat-refund, direction: in }
  - { match: VENMO, category_id: cat-side-income, direction: in }
  - { match: PAYPAL, category_id: cat-side-income, direction: in }
  - { match: INTEREST, category_id: cat-other-income, direction: in }
  # rent and home
