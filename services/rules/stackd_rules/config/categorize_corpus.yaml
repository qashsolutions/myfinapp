# Training corpus for the on-device category suggester (owner decision, October 11, 2026:
# a bundled, deterministic, learned model is allowed; external AI services stay banned).
#
# `train` teaches the model; `eval` is a held-out set of DIFFERENT merchants that measures it
# (scripts/train_categorizer.py refuses to ship a model below the accuracy floor). Curated by
# hand from public US merchant names: no user data is ever collected for this (local-first).
# The script adds processor noise ("SQ *", store numbers, city + state) deterministically, so
# plain names are enough here. Edit, then `uv run python scripts/train_categorizer.py`.
#
# Only money-out categories are learned. Savings and Other are never predicted: transfers have
# their own hint, and below-confidence answers fall back to Uncategorized rather than a guess.

