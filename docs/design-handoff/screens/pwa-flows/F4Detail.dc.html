<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 4 — Jar detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <header style="display:flex;align-items:center;gap:10px">
    <a href="F4Goals.dc.html" aria-label="Back" style="{{S.icon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="flex:1;font:700 22px Outfit,sans-serif">Travel</span>
    <button style="{{S.small}}">Edit</button>
  </header>

  <section style="{{S.hero}}">
    <div style="position:relative;width:132px;height:132px">
      <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="14"></circle><circle cx="66" cy="66" r="56" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 66 66)"></circle></svg>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px Outfit,sans-serif">{{pct}}</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <span style="font:700 26px Outfit,sans-serif;font-variant-numeric:tabular-nums">{{saved}}</span>
      <span style="font-size:14px;opacity:0.9">of $2,000 by Jun 2027</span>
      <span style="font-size:13px;opacity:0.9">“Lisbon with Sam, next June”</span>
    </div>
  </section>

  <div style="{{S.card}}">
    <span style="font-size:13px;font-weight:600;color:{{m.sub}}">Log money you set aside</span>
    <div style="display:flex;gap:8px">
      <button onClick="{{add76}}" style="{{S.amt}}">+$76</button><button onClick="{{add100}}" style="{{S.amt}}">+$100</button><button onClick="{{add200}}" style="{{S.amt}}">+$200</button>
    </div>
    <span style="font-size:12px;color:{{m.sub}}">This records it in Stackd. Your money stays where it is.</span>
  </div>

  <div style="{{S.card}}">
    <div style="display:flex;justify-content:space-between"><span style="font:600 16px Outfit,sans-serif">Milestones</span><span style="font-size:13px;color:{{m.good}};font-weight:600">On track · $76/paycheck</span></div>
    <sc-for list="{{miles}}" as="x" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:10px;min-height:40px"><span style="{{x.dot}}">{{x.mark}}</span><span style="flex:1;font-size:15px">{{x.n}}</span><span style="font-size:13px;color:{{m.sub}}">{{x.s}}</span></div>
    </sc-for>
  </div>

  <div style="{{S.card}}">
    <span style="font:600 16px Outfit,sans-serif">Recent deposits</span>
    <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
      <div style="display:flex;justify-content:space-between;min-height:36px;align-items:center;font-size:14px"><span style="color:{{m.sub}}">{{l.d}}</span><b style="font-variant-numeric:tabular-nums;color:{{m.good}}">{{l.v}}</b></div>
    </sc-for>
  </div>

  <div style="display:flex;gap:10px;margin-top:auto">
    <button style="{{S.ghost}}">Pause jar</button><button style="{{S.ghost}}">Move money</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { saved: 640, added: [] }; }
  renderVals() {
    const dark = !!this.props.dark, st = this.state;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', tint: '#1E2433', acc: '#8FA2FF', good: '#6FD39B' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', tint: '#EEF1FF', acc: '#3D5AFE', good: '#1E7A4C' };
    const f = Math.min(1, st.saved / 2000), C = 2 * Math.PI * 56;
    const miles = [[0.25, '25% · $500'], [0.5, '50% · $1,000'], [0.75, '75% · $1,500']].map(([t, n]) => {
      const done = f >= t;
      return { n, mark: done ? '✓' : '', s: done ? 'Reached' : '$' + Math.ceil(t * 2000 - st.saved).toLocaleString('en-US') + ' to go',
        dot: 'width:26px;height:26px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px Outfit,sans-serif;box-sizing:border-box;' + (done ? 'background:#0B7A55;color:#FFFFFF' : 'border:2px solid ' + m.line) };
    });
    const add = (v) => () => this.setState({ saved: st.saved + v, added: [v].concat(st.added) });
    const log = st.added.map(v => ({ d: 'Today', v: '+$' + v })).concat([{ d: 'Oct 2', v: '+$76' }, { d: 'Sep 18', v: '+$76' }, { d: 'Sep 4', v: '+$100' }]).slice(0, 3);
    const btn = 'flex:1;min-height:48px;border-radius:14px;cursor:pointer;font:600 15px Outfit,sans-serif;';
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:24px 18px 28px;display:flex;flex-direction:column;gap:12px;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      icon: 'width:44px;height:44px;flex-shrink:0;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      small: 'min-height:44px;padding:0 14px;border:0;border-radius:12px;cursor:pointer;background:' + m.card + ';font:600 14px Outfit,sans-serif;color:' + m.acc,
      hero: 'display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;background:#3D5AFE;color:#FFFFFF',
      card: 'display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:20px;background:' + m.card,
      amt: btn + 'border:0;background:' + m.tint + ';color:' + m.acc,
      ghost: btn + 'min-height:52px;background:transparent;color:' + m.ink + ';border:1px solid ' + m.line
    };
    return { S, m, miles, log, saved: '$' + st.saved.toLocaleString('en-US'), pct: Math.round(f * 100) + '%',
      dash: (C * f).toFixed(1) + ' ' + C.toFixed(1), add76: add(76), add100: add(100), add200: add(200) };
  }
}
</script>
</body>
</html>
