<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 3 — Match columns</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
select{appearance:none}
</style>
</helmet>
<div style="{{S.root}}">
  <header style="display:flex;align-items:center;gap:10px">
    <a href="F3Import.dc.html" aria-label="Back" style="{{S.icon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="flex:1;font:700 22px Outfit,sans-serif">Match columns</span>
    <span style="font-size:13px;color:{{m.sub}}">2 of 3</span>
  </header>
  <span style="font-size:14px;color:{{m.sub}};line-height:1.45">statement_oct.csv · Everyday checking. We guessed these — check them once and we'll remember for this account.</span>

  <section style="{{S.card}}">
    <sc-for list="{{maps}}" as="r" hint-placeholder-count="4">
      <div style="{{S.mapRow}}">
        <span style="width:96px;font-size:14px;font-weight:600">{{r.f}}</span>
        <span style="color:{{m.sub}}">→</span>
        <label style="flex:1;position:relative"><span style="position:absolute;left:-9999px">{{r.f}} column</span>
          <select style="{{S.select}}"><option>{{r.c}}</option></select></label>
      </div>
    </sc-for>
    <div style="display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;color:{{m.sub}}">Amounts: <b style="color:{{m.ink}}">negative = money out</b> · Dates: <b style="color:{{m.ink}}">MM/DD/YYYY</b></div>
  </section>

  <span style="font:600 16px Outfit,sans-serif">Preview</span>
  <section style="{{S.card}}">
    <sc-for list="{{rows}}" as="p" hint-placeholder-count="4">
      <div style="{{S.pRow}}"><span style="width:52px;font-size:12px;color:{{m.sub}}">{{p.d}}</span><span style="flex:1;font-size:14px">{{p.n}}</span><span style="{{p.st}}">{{p.v}}</span></div>
    </sc-for>
  </section>

  <button onClick="{{flip}}" aria-pressed="{{saveStr}}" style="{{S.toggleRow}}"><span style="flex:1;text-align:left;font-size:15px;font-weight:600">Remember this for Everyday checking</span><span style="{{S.track}}"><span style="{{S.knob}}"></span></span></button>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <a href="F3Review.dc.html" style="{{S.primary}}">Looks right</a>
    <span style="text-align:center;font-size:12px;color:{{m.sub}}">OFX, QFX and supported PDFs skip this step.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { save: true }; }
  renderVals() {
    const dark = !!this.props.dark, on = this.state.save;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', acc: '#8FA2FF', good: '#6FD39B' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', acc: '#3D5AFE', good: '#1E7A4C' };
    const maps = [['Date', 'Posting Date'], ['Description', 'Description'], ['Amount', 'Amount'], ['Balance', 'Balance (optional)']].map(([f, c]) => ({ f, c }));
    const rows = [['10/08', 'CORNER MKT #214', -42.17], ['10/07', 'METRO TRANSIT', -2.75], ['10/06', 'PAYMENT TO CARD 1173', -1200], ['10/02', 'ACME PAYROLL', 2400]]
      .map(([d, n, v]) => ({ d, n, v: (v > 0 ? '+' : '−') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2 }), st: 'font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:' + (v > 0 ? m.good : m.ink) }));
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:24px 18px 28px;display:flex;flex-direction:column;gap:12px;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      icon: 'width:44px;height:44px;flex-shrink:0;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      card: 'display:flex;flex-direction:column;padding:4px 16px;border-radius:20px;background:' + m.card,
      mapRow: 'display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid ' + m.line,
      select: 'width:100%;min-height:44px;padding:0 12px;border-radius:12px;font:500 14px Outfit,sans-serif;color:' + m.ink + ';background:' + m.bg + ';border:1px solid ' + m.line,
      pRow: 'display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid ' + m.line,
      toggleRow: 'display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:0;border-radius:18px;cursor:pointer;background:' + m.card + ';color:' + m.ink + ';font-family:Outfit,sans-serif',
      track: 'width:52px;height:32px;flex-shrink:0;border-radius:999px;display:flex;align-items:center;background:' + (on ? '#0B7A55' : (dark ? '#33333D' : '#D5D7DE')),
      knob: 'width:26px;height:26px;border-radius:50%;background:#FFFFFF;margin-left:' + (on ? '23px' : '3px'),
      primary: 'min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 16px Outfit,sans-serif;background:#3D5AFE;color:#FFFFFF'
    };
    return { S, m, maps, rows, saveStr: on ? 'true' : 'false', flip: () => this.setState({ save: !on }) };
  }
}
</script>
</body>
</html>
