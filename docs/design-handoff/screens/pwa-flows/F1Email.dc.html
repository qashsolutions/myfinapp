<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 1 — Email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <a href="F1Welcome.dc.html" aria-label="Back" style="{{S.back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>

  <div style="display:flex;flex-direction:column;gap:10px;margin-top:28px">
    <span style="font:700 30px Outfit,sans-serif;letter-spacing:-0.01em">What's your email?</span>
    <span style="font-size:16px;line-height:1.45;color:{{m.sub}}">We'll send a 6-digit code. There's no password to create or forget.</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;margin-top:28px">
    <label for="em" style="font-size:13px;font-weight:600;color:{{m.sub}}">Email address</label>
    <input id="em" type="email" inputmode="email" autocomplete="email" value="{{email}}" onChange="{{setEmail}}" placeholder="you@example.com" style="{{S.input}}">
    <sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}">
      <span style="font-size:13px;color:{{m.warn}}">Enter a full email address, like you@example.com</span>
    </sc-if>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
    <sc-if value="{{valid}}" hint-placeholder-val="{{ false }}">
      <a href="F1Code.dc.html" style="{{S.primary}}">Send code</a>
    </sc-if>
    <sc-if value="{{invalid}}" hint-placeholder-val="{{ true }}">
      <button disabled style="{{S.disabled}}">Send code</button>
    </sc-if>
    <span style="text-align:center;font-size:12px;color:{{m.sub}}">New here? The same code creates your account.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { email: 'maya.r@example.com' }; }
  renderVals() {
    const dark = !!this.props.dark;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', warn: '#FFB547' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', warn: '#A85A00' };
    const e = this.state.email.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
    const btn = 'min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 16px Outfit,sans-serif;width:100%;box-sizing:border-box;';
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:28px 22px 30px;display:flex;flex-direction:column;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      back: 'width:44px;height:44px;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      input: 'min-height:56px;padding:0 16px;box-sizing:border-box;width:100%;font:500 17px Outfit,sans-serif;color:' + m.ink + ';background:' + m.card + ';border:2px solid ' + (valid ? '#3D5AFE' : m.line) + ';border-radius:16px;outline:none',
      primary: btn + 'background:#3D5AFE;color:#FFFFFF',
      disabled: btn + 'border:0;background:' + (dark ? '#262A36' : '#DCDFE7') + ';color:' + m.sub
    };
    return { S, m, email: this.state.email, valid, invalid: !valid, showHint: !valid && e.length > 3,
      setEmail: (ev) => this.setState({ email: ev.target.value }) };
  }
}
</script>
</body>
</html>
