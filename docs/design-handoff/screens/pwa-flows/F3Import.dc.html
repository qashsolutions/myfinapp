<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 3 — Import statement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <header style="display:flex;align-items:center;gap:10px">
    <a href="F3Home.dc.html" aria-label="Close" style="{{S.icon}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="flex:1;font:700 22px Outfit,sans-serif">Import a statement</span>
    <span style="font-size:13px;color:{{m.sub}}">1 of 3</span>
  </header>

  <label for="file" style="{{S.drop}}">
    <span style="width:56px;height:56px;border-radius:16px;background:{{m.tint}};color:{{m.acc}};display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"></path></svg></span>
    <span style="font:600 17px Outfit,sans-serif">{{fileLabel}}</span>
    <span style="font-size:13px;color:{{m.sub}}">CSV, OFX, QFX or PDF from your bank or card</span>
    <input id="file" type="file" accept=".csv,.ofx,.qfx,.pdf" onChange="{{pick}}" style="position:absolute;width:1px;height:1px;opacity:0">
  </label>
  <div style="{{S.note}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"></rect></svg>Read on this device. The file is never uploaded.</div>

  <span style="font:600 16px Outfit,sans-serif;margin-top:4px">Which account is this?</span>
  <div style="{{S.card}}">
    <sc-for list="{{accts}}" as="a" hint-placeholder-count="3">
      <button onClick="{{a.pick}}" aria-pressed="{{a.sel}}" style="{{a.st}}">
        <span style="{{a.radio}}"></span>
        <span style="flex:1;display:flex;flex-direction:column;text-align:left"><span style="font-size:15px;font-weight:600">{{a.n}}</span><span style="font-size:12px;color:{{m.sub}}">{{a.s}}</span></span>
      </button>
    </sc-for>
    <button style="{{S.add}}">+ New account</button>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <a href="F3Map.dc.html" style="{{S.primary}}">Read file</a>
    <span style="text-align:center;font-size:12px;color:{{m.sub}}">PDF supported for: [launch bank list]. Others: download CSV from your bank.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { acct: 0, file: 'statement_oct.csv' }; }
  renderVals() {
    const dark = !!this.props.dark, st = this.state;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', tint: '#1E2433', acc: '#8FA2FF' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', tint: '#EEF1FF', acc: '#3D5AFE' };
    const A = [['Everyday checking', 'Checking ••4821 · last import Oct 8'], ['Rewards card', 'Credit card ••1173 · last import Oct 2'], ['Savings', 'Savings ••0094 · never imported']];
    const accts = A.map(([n, s], i) => {
      const on = st.acct === i;
      return { n, s, sel: on ? 'true' : 'false', pick: () => this.setState({ acct: i }),
        st: 'width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:0;border:0;border-bottom:1px solid ' + m.line + ';background:transparent;color:' + m.ink + ';font-family:Outfit,sans-serif;cursor:pointer',
        radio: 'width:20px;height:20px;border-radius:50%;flex-shrink:0;box-sizing:border-box;border:' + (on ? '6px solid #3D5AFE' : '2px solid ' + m.sub) };
    });
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:24px 18px 28px;display:flex;flex-direction:column;gap:12px;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      icon: 'width:44px;height:44px;flex-shrink:0;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      drop: 'position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border-radius:22px;cursor:pointer;text-align:center;background:' + m.card + ';border:2px dashed ' + (st.file ? '#3D5AFE' : m.line),
      note: 'display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:' + (dark ? '#6FD39B' : '#1E7A4C'),
      card: 'display:flex;flex-direction:column;padding:0 16px 4px;border-radius:20px;background:' + m.card,
      add: 'min-height:48px;border:0;background:transparent;text-align:left;font:600 15px Outfit,sans-serif;color:' + m.acc + ';cursor:pointer',
      primary: 'min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 16px Outfit,sans-serif;background:#3D5AFE;color:#FFFFFF'
    };
    return { S, m, accts, fileLabel: st.file ? st.file + ' · 48 rows' : 'Choose a file',
      pick: (e) => this.setState({ file: (e.target.files && e.target.files[0] && e.target.files[0].name) || st.file }) };
  }
}
</script>
</body>
</html>
