<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 6 — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <span style="font:700 28px Outfit,sans-serif">Settings</span>

  <section style="{{S.profile}}">
    <span style="width:52px;height:52px;border-radius:50%;background:#7C3AED;color:#FFFFFF;font:700 20px Outfit,sans-serif;display:flex;align-items:center;justify-content:center">N</span>
    <div style="flex:1;display:flex;flex-direction:column"><span style="font:600 17px Outfit,sans-serif">[Name]</span><span style="font-size:13px;color:{{m.sub}}">maya.r@example.com</span></div>
    <button style="{{S.small}}">Edit</button>
  </section>

  <a href="../pwa/PwaInstall.dc.html" style="{{S.install}}"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:15px">Install Stackd</span><span style="font-size:13px;opacity:0.9">Keeps your data safer and turns on alerts</span></span><span style="font-size:20px">›</span></a>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
    <section style="display:flex;flex-direction:column;gap:6px">
      <span style="{{S.label}}">{{g.h}}</span>
      <div style="{{S.list}}">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <a href="{{r.h}}" style="{{S.row}}"><span style="flex:1;display:flex;flex-direction:column"><span style="{{r.nSt}}">{{r.n}}</span><span style="font-size:12px;color:{{m.sub}}">{{r.s}}</span></span><span style="{{r.vSt}}">{{r.v}}</span></a>
        </sc-for>
      </div>
    </section>
  </sc-for>

  <span style="text-align:center;font-size:12px;color:{{m.sub}}">Stackd v1.0.0 (web app) · [Company legal name]</span>

  <nav style="{{S.nav}}">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="{{t.h}}" style="{{t.st}}">{{t.n}}</a></sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', tint: '#1E2433', acc: '#8FA2FF', good: '#6FD39B', danger: '#FF6B7D' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', tint: '#EEF1FF', acc: '#3D5AFE', good: '#1E7A4C', danger: '#C4122F' };
    const r = (n, s, v, h, tone) => ({ n, s: s || '', v: v || '›', h: h || 'F6Settings.dc.html',
      nSt: 'font-size:15px;font-weight:600;color:' + (tone === 'danger' ? m.danger : m.ink),
      vSt: 'font-size:14px;font-weight:600;white-space:nowrap;color:' + (tone === 'good' ? m.good : m.sub) });
    const groups = [
      { h: 'Money', rows: [r('Accounts & imports', '3 accounts · last import Oct 8', '', 'F6Accounts.dc.html'), r('Categories & rules', '12 categories · 5 of your rules')] },
      { h: 'Plan', rows: [r('Private · yearly', 'Renews Oct 9, 2027 · $23.88', '', 'F6Plan.dc.html')] },
      { h: 'Security & backup', rows: [r('Passkeys & devices', '2 passkeys · 2 devices', '', 'F6Security.dc.html'), r('Encrypted backup', 'Last backup 2 hours ago', 'On', 'F6Security.dc.html', 'good')] },
      { h: 'Notifications', rows: [r('Alerts', '6 types · quiet 9pm–8am · max 3 a day', '', 'F6Notify.dc.html')] },
      { h: 'Display', rows: [r('Dark mode', 'Matches your device', 'Auto'), r('Simple layout', 'Hide decorations, plain lists', 'Off')] },
      { h: 'Your data', rows: [r('Keep receipt photos', 'Stored on this device', '90 days'), r('Download all my data', 'Built on this device, ZIP', '', 'F1StepUp.dc.html'), r('Delete account', 'Removes everything, everywhere', '', 'F6Delete.dc.html', 'danger')] },
      { h: 'Privacy & legal', rows: [r('Privacy policy', '', '↗'), r('Terms of service', '', '↗'), r('Data we never collect', 'No bank passwords, no selling data'), r('Help & contact', 'support@[domain]'), r('Log out', '', '')] }
    ];
    const S = {
      root: 'width:390px;height:1700px;position:relative;overflow:hidden;box-sizing:border-box;padding:24px 18px 110px;display:flex;flex-direction:column;gap:14px;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      profile: 'display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:' + m.card,
      small: 'min-height:44px;padding:0 14px;border:0;border-radius:12px;cursor:pointer;background:' + m.tint + ';font:600 14px Outfit,sans-serif;color:' + m.acc,
      install: 'display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:#3D5AFE;color:#FFFFFF',
      label: 'font-size:13px;font-weight:600;color:' + m.sub + ';padding-left:6px',
      list: 'display:flex;flex-direction:column;padding:0 16px;border-radius:20px;background:' + m.card,
      row: 'display:flex;align-items:center;gap:10px;min-height:58px;border-bottom:1px solid ' + m.line,
      nav: 'position:absolute;left:16px;right:16px;bottom:18px;height:68px;padding:0 6px;display:flex;align-items:center;background:' + m.card + ';border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,' + (dark ? '0.4' : '0.10') + ')'
    };
    const tabs = [['Home', 'F3Home.dc.html'], ['Budget', 'F5Budget.dc.html'], ['Goals', 'F4Goals.dc.html'], ['Learn', 'F5Learn.dc.html'], ['Me', 'F6Settings.dc.html']].map(([n, h], i) => ({ n, h,
      st: 'flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 12px Outfit,sans-serif;' + (i === 4 ? 'background:#3D5AFE;color:#FFFFFF' : 'color:' + m.sub) }));
    return { S, m, groups, tabs };
  }
}
</script>
</body>
</html>
