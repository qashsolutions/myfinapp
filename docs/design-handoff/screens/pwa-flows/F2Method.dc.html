<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 2 — Budget method</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="F2Pay.dc.html" aria-label="Back" style="{{S.back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex:1;display:flex;gap:6px" aria-label="Step 2 of 5">
      <span style="{{S.on}}"></span><span style="{{S.on}}"></span><span style="{{S.off}}"></span><span style="{{S.off}}"></span><span style="{{S.off}}"></span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">
    <span style="font:700 30px Outfit,sans-serif;letter-spacing:-0.01em">Pick a budget style</span>
    <span style="font-size:16px;line-height:1.45;color:{{m.sub}}">Based on <b style="color:{{m.ink}}">$5,200 a month</b>. You can switch anytime.</span>
  </div>

  <button onClick="{{pickRule}}" aria-pressed="{{ruleSel}}" style="{{S.cardRule}}">
    <div style="display:flex;justify-content:space-between;align-items:center;width:100%"><span style="font:700 19px Outfit,sans-serif">50 / 30 / 20</span><span style="{{S.tag}}">Easiest start</span></div>
    <span style="font-size:14px;color:{{m.sub}};text-align:left">Half for needs, 30% for wants, 20% to save or pay down debt.</span>
    <div style="display:flex;gap:4px;width:100%;margin-top:4px"><span style="flex:5;height:10px;border-radius:5px;background:#3D5AFE"></span><span style="flex:3;height:10px;border-radius:5px;background:#7C3AED"></span><span style="flex:2;height:10px;border-radius:5px;background:#0B7A55"></span></div>
    <div style="display:flex;justify-content:space-between;width:100%;font-size:13px;font-variant-numeric:tabular-nums"><span>Needs $2,600</span><span>Wants $1,560</span><span>Save $1,040</span></div>
  </button>

  <button onClick="{{pickZero}}" aria-pressed="{{zeroSel}}" style="{{S.cardZero}}">
    <div style="display:flex;justify-content:space-between;align-items:center;width:100%"><span style="font:700 19px Outfit,sans-serif">Zero-based</span><span style="{{S.tag2}}">Most control</span></div>
    <span style="font-size:14px;color:{{m.sub}};text-align:left">Give every dollar a job until $0 is left to assign. More setup, sharper picture.</span>
    <div style="display:flex;justify-content:space-between;width:100%;font-size:13px;font-variant-numeric:tabular-nums;margin-top:4px"><span>Left to assign</span><b>$5,200 → $0</b></div>
  </button>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <a href="F2Data.dc.html" style="{{S.primary}}">Continue</a>
    <span style="text-align:center;font-size:12px;color:{{m.sub}}">Not sure? 50/30/20 works for most people.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { method: 'rule' }; }
  renderVals() {
    const dark = !!this.props.dark, rule = this.state.method === 'rule';
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', tint: '#1E2433', acc: '#8FA2FF' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', tint: '#EEF1FF', acc: '#3D5AFE' };
    const card = (on) => 'margin-top:16px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border-radius:20px;cursor:pointer;font-family:Outfit,sans-serif;color:' + m.ink + ';background:' + m.card + ';border:2px solid ' + (on ? '#3D5AFE' : m.line) + (on ? ';box-shadow:0 6px 20px rgba(61,90,254,0.15)' : '');
    const bar = 'flex:1;height:6px;border-radius:3px;';
    const tag = 'font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;';
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:28px 22px 30px;display:flex;flex-direction:column;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      back: 'width:44px;height:44px;flex-shrink:0;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      on: bar + 'background:#3D5AFE', off: bar + 'background:' + m.line,
      cardRule: card(rule), cardZero: card(!rule),
      tag: tag + 'background:' + m.tint + ';color:' + m.acc,
      tag2: tag + 'background:' + (dark ? '#1F1636' : '#F1EAFE') + ';color:' + (dark ? '#C4A8FF' : '#6B2BD9'),
      primary: 'min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 16px Outfit,sans-serif;background:#3D5AFE;color:#FFFFFF'
    };
    return { S, m, ruleSel: rule ? 'true' : 'false', zeroSel: rule ? 'false' : 'true',
      pickRule: () => this.setState({ method: 'rule' }), pickZero: () => this.setState({ method: 'zero' }) };
  }
}
</script>
</body>
</html>
