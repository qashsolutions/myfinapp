<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 4 — New goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <header style="display:flex;align-items:center;gap:10px">
    <a href="F4Goals.dc.html" aria-label="Close" style="{{S.icon}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="font:700 22px Outfit,sans-serif">New goal</span>
  </header>

  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><button onClick="{{k.pick}}" aria-pressed="{{k.sel}}" style="{{k.st}}">{{k.n}}</button></sc-for>
  </div>

  <section style="{{S.card}}">
    <span style="font-size:12px;font-weight:600;color:{{m.sub}}">Tap a highlighted word to change it</span>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 21px Outfit,sans-serif;line-height:1.3">
      <span>Save</span><button onClick="{{openAmt}}" style="{{S.pill}}">{{amtLabel}}</button>
      <span>for</span><button onClick="{{openFor}}" style="{{S.pill}}">{{forLabel}}</button>
      <span>by</span><button onClick="{{openWhen}}" style="{{S.pill}}">Jun 2027</button>
      <span>,</span><button onClick="{{openOften}}" style="{{S.pill}}">every paycheck</button>
    </div>
  </section>

  <section style="{{S.preview}}">
    <span style="font-size:13px;font-weight:600">{{forLabel}} jar</span>
    <span style="font:700 30px Outfit,sans-serif;font-variant-numeric:tabular-nums">$106 a paycheck</span>
    <span style="font-size:13px;opacity:0.9">19 paychecks to {{amtLabel}} · first deposit Oct 16</span>
  </section>

  <section style="{{S.card}}">
    <label for="why" style="font-size:13px;font-weight:600;color:{{m.sub}}">Why it matters (optional)</label>
    <input id="why" value="Lisbon with Sam, next June" style="{{S.input}}">
    <div style="display:flex;justify-content:space-between;align-items:center;min-height:48px"><span style="font-size:15px;font-weight:600">Milestones at 25%, 50%, 75%</span><span style="{{S.on}}"><span style="{{S.knob}}"></span></span></div>
  </section>

  <div style="margin-top:auto"><a href="F4Detail.dc.html" style="{{S.primary}}">Create jar</a></div>

  <sc-if value="{{sheetFor}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;background:rgba(10,12,18,0.5)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="fs" style="{{S.sheet}}">
      <span id="fs" style="font:700 20px Outfit,sans-serif">What's it for?</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{fors}}" as="f" hint-placeholder-count="5"><button onClick="{{f.pick}}" style="{{f.st}}">{{f.n}}</button></sc-for>
      </div>
      <label for="custom" style="font-size:13px;font-weight:600;color:{{m.sub}}">Or name your own</label>
      <input id="custom" value="{{custom}}" onChange="{{setCustom}}" placeholder="e.g. New laptop" style="{{S.input}}">
      <span style="font-size:13px;font-weight:600;color:{{m.sub}}">Color</span>
      <div style="display:flex;gap:10px">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="5"><button onClick="{{c.pick}}" aria-label="{{c.n}}" aria-pressed="{{c.sel}}" style="{{c.st}}"></button></sc-for>
      </div>
      <button onClick="{{useCustom}}" style="{{S.primaryBtn}}">Use this</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { kind: 'save', sheet: 'for', forV: 'Travel', custom: '', color: 0 }; }
  renderVals() {
    const dark = !!this.props.dark, st = this.state;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', tint: '#1E2433', acc: '#8FA2FF' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', tint: '#EEF1FF', acc: '#3D5AFE' };
    const chip = (on) => 'min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;font:600 14px Outfit,sans-serif;' + (on ? 'background:' + m.tint + ';color:' + m.acc + ';border:2px solid #3D5AFE' : 'background:' + m.card + ';color:' + m.ink + ';border:2px solid ' + m.line);
    const kinds = [['save', 'Save (jar)'], ['payoff', 'Pay off'], ['spend', 'Spend less'], ['habit', 'Habit']].map(([k, n]) => ({ n, sel: st.kind === k ? 'true' : 'false', st: chip(st.kind === k), pick: () => this.setState({ kind: k }) }));
    const fors = ['Travel', 'Emergency', 'Kids\u2019 education', 'New car', 'Home'].map(n => ({ n, st: chip(st.forV === n), pick: () => this.setState({ forV: n, sheet: null }) }));
    const C = ['#3D5AFE', '#7C3AED', '#0B7A55', '#C2410C', '#BE185D'];
    const colors = C.map((c, i) => ({ n: 'Color ' + (i + 1), sel: st.color === i ? 'true' : 'false', pick: () => this.setState({ color: i }),
      st: 'width:44px;height:44px;border-radius:50%;cursor:pointer;background:' + c + ';border:' + (st.color === i ? '3px solid ' + m.ink : '3px solid transparent') }));
    const input = 'min-height:52px;padding:0 14px;box-sizing:border-box;width:100%;font:500 16px Outfit,sans-serif;color:' + m.ink + ';background:' + m.bg + ';border:1px solid ' + m.line + ';border-radius:14px;outline:none';
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:24px 18px 28px;display:flex;flex-direction:column;gap:12px;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      icon: 'width:44px;height:44px;flex-shrink:0;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      card: 'display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:' + m.card,
      pill: 'min-height:44px;padding:0 12px;border:0;border-radius:12px;cursor:pointer;font:600 19px Outfit,sans-serif;background:' + m.tint + ';color:' + m.acc + ';text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px',
      preview: 'display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:20px;color:#FFFFFF;background:' + C[st.color],
      input, on: 'width:52px;height:32px;border-radius:999px;display:flex;align-items:center;background:#0B7A55', knob: 'width:26px;height:26px;border-radius:50%;background:#FFFFFF;margin-left:23px',
      primary: 'min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 16px Outfit,sans-serif;background:#3D5AFE;color:#FFFFFF',
      primaryBtn: 'min-height:54px;border:0;border-radius:16px;cursor:pointer;font:600 16px Outfit,sans-serif;background:#3D5AFE;color:#FFFFFF',
      sheet: 'position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:20px 20px 28px;display:flex;flex-direction:column;gap:12px;background:' + m.card + ';border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.25)'
    };
    const open = (k) => () => this.setState({ sheet: k === 'for' ? 'for' : null });
    return { S, m, kinds, fors, colors, custom: st.custom, amtLabel: '$2,000', forLabel: st.forV, sheetFor: st.sheet === 'for',
      openAmt: open('amt'), openFor: open('for'), openWhen: open('when'), openOften: open('often'),
      setCustom: (e) => this.setState({ custom: e.target.value }),
      useCustom: () => this.setState({ forV: st.custom.trim() || st.forV, sheet: null }) };
  }
}
</script>
</body>
</html>
