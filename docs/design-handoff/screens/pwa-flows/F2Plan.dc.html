<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow 2 — Choose a plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{S.root}}">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="F2Goal.dc.html" aria-label="Back" style="{{S.back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex:1;display:flex;gap:6px" aria-label="Step 5 of 5">
      <span style="{{S.on}}"></span><span style="{{S.on}}"></span><span style="{{S.on}}"></span><span style="{{S.on}}"></span><span style="{{S.on}}"></span>
    </div>
  </div>

  <span style="font:700 28px Outfit,sans-serif;letter-spacing:-0.01em;margin-top:18px">Choose your plan</span>

  <div style="{{S.toggle}}" role="group" aria-label="Billing period">
    <button onClick="{{goAnnual}}" aria-pressed="{{annualSel}}" style="{{S.tA}}">Yearly · save up to 34%</button>
    <button onClick="{{goMonthly}}" aria-pressed="{{monthlySel}}" style="{{S.tM}}">Monthly</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
    <button onClick="{{pickFree}}" aria-pressed="{{freeSel}}" style="{{S.cFree}}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;width:100%"><span style="font:700 18px Outfit,sans-serif">Free</span><span style="font:700 18px Outfit,sans-serif">$0</span></div>
      <span style="font-size:13px;color:{{m.sub}};text-align:left">1 account · 3 jars · join challenges · shortfall alerts</span>
    </button>
    <button onClick="{{pickPrivate}}" aria-pressed="{{privSel}}" style="{{S.cPriv}}">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%"><span style="display:flex;align-items:center;gap:8px"><span style="font:700 18px Outfit,sans-serif">Private</span><span style="{{S.pop}}">Most popular</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><span style="font:700 18px Outfit,sans-serif;font-variant-numeric:tabular-nums">{{privPrice}}</span><span style="font-size:11px;color:{{m.sub}}">{{privBill}}</span></span></div>
      <span style="font-size:13px;color:{{m.sub}};text-align:left">Unlimited accounts and jars · create challenges · encrypted backup and sync. Data never leaves your devices.</span>
    </button>
    <div style="{{S.cConn}}">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%"><span style="display:flex;align-items:center;gap:8px"><span style="font:700 18px Outfit,sans-serif">Connected</span><span style="{{S.soon}}">Coming soon</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><span style="font:700 18px Outfit,sans-serif;font-variant-numeric:tabular-nums;color:{{m.sub}}">{{connPrice}}</span><span style="font-size:11px;color:{{m.sub}}">{{connBill}}</span></span></div>
      <span style="font-size:13px;color:{{m.sub}};text-align:left">Everything in Private, plus read-only bank linking for up to 3 banks with automatic updates.</span>
      <button onClick="{{join}}" style="{{S.wait}}">{{waitLabel}}</button>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <a href="F2Keep.dc.html" style="{{S.primary}}">{{cta}}</a>
    <span style="text-align:center;font-size:12px;line-height:1.4;color:{{m.sub}}">{{terms}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { annual: true, plan: 'private', joined: false }; }
  renderVals() {
    const dark = !!this.props.dark, st = this.state;
    const m = dark ? { bg: '#0B0D12', card: '#151821', ink: '#F1F3F8', sub: '#9AA1B2', line: '#262A36', tint: '#1E2433', acc: '#8FA2FF' }
                   : { bg: '#F4F5F8', card: '#FFFFFF', ink: '#111827', sub: '#5B6272', line: '#E4E7EE', tint: '#EEF1FF', acc: '#3D5AFE' };
    const card = (on) => 'width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;border-radius:18px;font-family:Outfit,sans-serif;color:' + m.ink + ';background:' + m.card + ';border:2px solid ' + (on ? '#3D5AFE' : m.line) + ';cursor:pointer';
    const seg = (on) => 'flex:1;min-height:44px;border:0;border-radius:12px;cursor:pointer;font:600 14px Outfit,sans-serif;' + (on ? 'background:' + m.card + ';color:' + m.ink + ';box-shadow:0 2px 6px rgba(0,0,0,0.12)' : 'background:transparent;color:' + m.sub);
    const bar = 'flex:1;height:6px;border-radius:3px;';
    const a = st.annual;
    const privPrice = a ? '$1.99/mo' : '$3/mo', privBill = a ? '$23.88 billed yearly' : 'billed monthly';
    const connPrice = a ? '$7.99/mo' : '$9.99/mo', connBill = a ? '$95.88 billed yearly' : 'billed monthly';
    const free = st.plan === 'free';
    const S = {
      root: 'width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:28px 22px 26px;display:flex;flex-direction:column;background:' + m.bg + ';color:' + m.ink + ";font-family:Outfit,'Helvetica Neue',sans-serif",
      back: 'width:44px;height:44px;flex-shrink:0;border-radius:50%;background:' + m.card + ';display:flex;align-items:center;justify-content:center',
      on: bar + 'background:#3D5AFE',
      toggle: 'margin-top:14px;display:flex;gap:4px;padding:4px;border-radius:14px;background:' + (dark ? '#1C1F28' : '#E7E9EF'),
      tA: seg(a), tM: seg(!a),
      cFree: card(free), cPriv: card(st.plan === 'private'),
      cConn: card(false).replace('cursor:pointer', 'border-style:dashed'),
      pop: 'font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:' + m.tint + ';color:' + m.acc,
      soon: 'font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:' + (dark ? '#3A2E12' : '#FFF4E0') + ';color:' + (dark ? '#FFB547' : '#8A4B00'),
      wait: 'min-height:44px;padding:0 14px;border-radius:12px;font:600 14px Outfit,sans-serif;cursor:pointer;background:transparent;color:' + m.acc + ';border:1px solid ' + m.line,
      primary: 'min-height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;font:600 16px Outfit,sans-serif;background:#3D5AFE;color:#FFFFFF'
    };
    return { S, m, privPrice, privBill, connPrice, connBill,
      annualSel: a ? 'true' : 'false', monthlySel: a ? 'false' : 'true', freeSel: free ? 'true' : 'false', privSel: free ? 'false' : 'true',
      cta: free ? 'Start free' : (a ? 'Get Private — $23.88/year' : 'Get Private — $3/month'),
      terms: free ? 'Upgrade anytime. Your data stays on this device either way.' : (a ? 'Renews yearly at $23.88 until you cancel. Cancel in two taps in Settings.' : 'Renews monthly at $3 until you cancel. Cancel in two taps in Settings.'),
      waitLabel: st.joined ? 'On the waitlist ✓' : 'Join the waitlist',
      goAnnual: () => this.setState({ annual: true }), goMonthly: () => this.setState({ annual: false }),
      pickFree: () => this.setState({ plan: 'free' }), pickPrivate: () => this.setState({ plan: 'private' }), join: () => this.setState({ joined: true }) };
  }
}
</script>
</body>
</html>
